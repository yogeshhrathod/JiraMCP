name: Bug report
description: Something failed or behaved unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste tokens, hostnames, email addresses or ticket contents.**
        If an AI assistant prepared this with `jira_report_issue`, it is already redacted; please still review it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you tried and what went wrong.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: jira_create_issue
  - type: textarea
    id: error
    attributes:
      label: Error (redacted)
      render: text
  - type: input
    id: version
    attributes:
      label: jira-mcp-server-pro version
  - type: input
    id: jira
    attributes:
      label: Jira version
      placeholder: 10.3.x Server / Data Center
  - type: input
    id: client
    attributes:
      label: MCP client and protocol era
      placeholder: Claude Desktop / Devin / Cursor; legacy or 2026-07-28
